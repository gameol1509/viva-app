<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VIVA Smart Mockup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Bố cục: thanh chọn 5 màn hình ở trên; màn điện thoại nằm trong khung máy, màn laptop dùng lưới rộng */
:root{
  --bg:#eef2f6; --surface:#ffffff; --sunk:#f6f8fb; --ink:#152033; --muted:#5a6578; --line:#dbe1ea;
  --brand:#0a66c2; --brand-ink:#ffffff; --brand-soft:#e2eefb;
  --ok:#137a48; --ok-soft:#e0f3e8; --warn:#a86200; --warn-soft:#fcefd8;
  --bad:#c0362c; --bad-soft:#fbe5e3; --wait:#6a4bbd; --wait-soft:#eee9fb;
  --frame:#1b2433; --shadow:0 1px 2px rgba(20,30,50,.06),0 8px 24px rgba(20,30,50,.08);
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e131b; --surface:#161d28; --sunk:#111821; --ink:#e6ebf2; --muted:#97a2b4; --line:#283244;
  --brand:#4d9cf0; --brand-ink:#08121f; --brand-soft:#132840;
  --ok:#4cc483; --ok-soft:#12291d; --warn:#f0b04c; --warn-soft:#2c2311;
  --bad:#f27b71; --bad-soft:#341816; --wait:#a88ff2; --wait-soft:#221b37;
  --frame:#000; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131b; --surface:#161d28; --sunk:#111821; --ink:#e6ebf2; --muted:#97a2b4; --line:#283244;
  --brand:#4d9cf0; --brand-ink:#08121f; --brand-soft:#132840;
  --ok:#4cc483; --ok-soft:#12291d; --warn:#f0b04c; --warn-soft:#2c2311;
  --bad:#f27b71; --bad-soft:#341816; --wait:#a88ff2; --wait-soft:#221b37;
  --frame:#000; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance}
.muted{color:var(--muted)}
.small{font-size:12px}

/* Thanh trên cùng */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line);margin-bottom:20px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brandrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{width:30px;height:30px;border-radius:8px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;font-size:15px}
.brandrow b{font-size:16px}
.tag{font-size:11px;letter-spacing:.04em;text-transform:uppercase;background:var(--warn-soft);color:var(--warn);padding:2px 8px;border-radius:99px;font-weight:600}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:99px;font-size:13px;display:flex;gap:6px;align-items:center}
.tabs button .dev{font-size:11px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs button[aria-selected="true"] .dev{color:inherit;opacity:.7}

/* Khung điện thoại */
.phonewrap{display:flex;gap:32px;justify-content:center;align-items:flex-start;flex-wrap:wrap}
.phone{width:390px;max-width:100%;height:800px;max-height:calc(100vh - 150px);min-height:600px;border:10px solid var(--frame);border-radius:42px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);position:relative}
.side{max-width:320px;min-width:0;display:flex;flex-direction:column;gap:12px;padding-top:8px}
.side h2{font-size:20px}
.side ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--muted)}
@media (max-width:720px){
  .phone{width:100%;border:0;border-radius:0;height:auto;max-height:none;min-height:0;box-shadow:none;overflow:visible;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));width:calc(100% + 32px);max-width:none}
  .side{display:none}
  .pscroll{overflow:visible!important}
  .pnav{position:sticky;bottom:0}
}
.pbar{display:flex;justify-content:space-between;padding:10px 20px 4px;font-size:12px;font-weight:600}
.phead{padding:6px 16px 12px;display:flex;flex-direction:column;gap:10px}
.pscroll{flex:1;overflow-y:auto;padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.pnav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.pnav button{border:0;background:none;padding:8px 0 10px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.pnav button svg{width:22px;height:22px}
.pnav button.on{color:var(--brand);font-weight:600}

/* Thành phần chung */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-moi{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.s-dang{background:var(--brand-soft);color:var(--brand)}
.s-cho{background:var(--wait-soft);color:var(--wait)}
.s-xong{background:var(--ok-soft);color:var(--ok)}
.s-qua{background:var(--bad-soft);color:var(--bad)}
.s-tra{background:var(--bad-soft);color:var(--bad)}
.s-chuanop{background:var(--sunk);color:var(--muted);border:1px dashed var(--line)}
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 14px;border-radius:10px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.ok{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.btn.bad{background:var(--surface);color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px}
.chips button.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600}
input[type=text],input[type=number],textarea,select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 11px;width:100%;font-weight:400}
textarea{resize:vertical;min-height:70px}
.sec-title{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;margin-top:6px}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.ph{width:72px;height:72px;border-radius:10px;position:relative;overflow:hidden;flex:0 0 auto;background-size:cover;background-position:center}
.ph span{position:absolute;left:4px;bottom:3px;font-size:10px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.addph{width:72px;height:72px;border-radius:10px;border:1.5px dashed var(--brand);color:var(--brand);background:var(--brand-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:600;gap:2px}
.addph input{display:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;z-index:50;max-width:calc(100% - 32px);box-shadow:var(--shadow)}

/* Màn 1 */
.hello{display:flex;justify-content:space-between;align-items:center}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;font-size:13px}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sum div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 8px;display:flex;flex-direction:column}
.sum b{font-size:18px}
.sum small{font-size:11px;color:var(--muted)}
.task{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;position:relative}
.task.qua{border-color:var(--bad)}
.task .row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.task h3{font-size:15px;font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.prio{font-size:11px;font-weight:600}
.prio.Cao{color:var(--bad)} .prio.Trung{color:var(--warn)} .prio.Thấp{color:var(--muted)}

/* Màn 2 */
.backrow{display:flex;align-items:center;gap:8px}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--sunk);border:1px solid var(--line);padding:4px;border-radius:12px}
.seg button{border:0;background:none;border-radius:8px;padding:7px 2px;font-size:12px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500}
.tl{display:flex;flex-direction:column;gap:0}
.tl .it{display:grid;grid-template-columns:14px 1fr;gap:10px;padding-bottom:14px;position:relative}
.tl .it::before{content:"";position:absolute;left:6px;top:14px;bottom:0;width:2px;background:var(--line)}
.tl .it:last-child::before{display:none}
.dot{width:14px;height:14px;border-radius:50%;border:3px solid var(--brand);background:var(--surface);margin-top:3px}
.tl .body{display:flex;flex-direction:column;gap:6px}

/* Màn 3 */
.deadline{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.chk:first-of-type{border-top:0}
.chk input{width:20px;height:20px;margin-top:1px;accent-color:var(--ok);flex:0 0 auto}
.chk .t{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.metrics label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.metrics input{text-align:center;font-size:18px;font-weight:700}
.done-screen{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:40px 10px}
.bigcheck{width:64px;height:64px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}

/* Laptop */
.laptop{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.lhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.lhead h1{font-size:24px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:500}
.kpi .val{font-size:24px;font-weight:700;letter-spacing:-.01em}
.delta{font-size:12px;font-weight:600}
.up{color:var(--ok)} .down{color:var(--bad)}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-size:15px;font-weight:600}
.phd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.bar i.w{background:var(--warn)}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.fin{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fin div{background:var(--sunk);border-radius:10px;padding:10px;display:flex;flex-direction:column}
.fin b{font-size:17px}
.complaint{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:10px 0;border-top:1px solid var(--line)}
.complaint:first-of-type{border-top:0}

/* Màn 5 */
.review{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.review{grid-template-columns:minmax(0,1fr)}}
.rlist{display:flex;flex-direction:column;gap:6px}
.ritem{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;width:100%}
.ritem.on{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.ritem .row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.ritem:disabled{cursor:default;opacity:.75}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.mgrid div{background:var(--sunk);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column}
.mgrid b{font-size:20px}
.list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.history{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.err{color:var(--bad);font-size:12px;font-weight:600}
@media (prefers-reduced-motion:no-preference){.task,.ritem,.btn{transition:transform .12s, box-shadow .12s}.task:active{transform:scale(.99)}}
</style>
</head><body>

<header class="top">
  <div class="brandrow">
    <div class="logo">V</div>
    <b>VIVA Smart · Quản lý công việc</b>
    <span class="tag">Bản mẫu · dữ liệu giả</span>
  </div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</header>
<main id="app"></main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const vn = (v, d=1) => v.toLocaleString('vi-VN', {maximumFractionDigits:d});

const SCREENS = [
  {id:'viec', name:'Việc hôm nay', dev:'Điện thoại'},
  {id:'chi-tiet', name:'Chi tiết việc', dev:'Điện thoại'},
  {id:'bao-cao', name:'Báo cáo cuối ngày', dev:'Điện thoại'},
  {id:'dashboard', name:'Dashboard', dev:'Laptop'},
  {id:'duyet', name:'Duyệt báo cáo', dev:'Laptop'},
];
const ST = {moi:'Mới', dang:'Đang làm', cho:'Đang chờ', xong:'Hoàn thành', qua:'Quá hạn'};
const pill = st => `<span class="pill s-${st}">${ST[st]}</span>`;

// Ảnh hiện trường giả: khối màu thay cho ảnh chụp
const PH = ['linear-gradient(135deg,#5b7083,#2f3d4c)','linear-gradient(135deg,#8a7a63,#4a3f31)','linear-gradient(135deg,#5f7d6c,#2d4136)','linear-gradient(135deg,#6d6f8f,#353650)','linear-gradient(135deg,#7f6a72,#3e3036)'];
const fakePh = (i, label) => `<div class="ph" style="background:${PH[i % PH.length]}"><span>${esc(label)}</span></div>`;
const realPh = (src) => `<div class="ph" style="background-image:url('${src}')"><span>Ảnh mới</span></div>`;

const tasks = [
  {id:1, title:'Lắp camera 4 mắt + đầu ghi', loai:'Lắp đặt', kh:'Anh Hoàng Văn Bình', sdt:'0912 345 678', dc:'Số 12 ngõ 85 Trần Quốc Hoàn, Cầu Giấy', gio:'08:30', han:'Hôm nay 11:00', uu:'Cao', st:'xong', giao:'Giám đốc · 24/11',
    log:[{t:'08:42',x:'Đã đến nơi, khảo sát vị trí lắp.',p:['Cổng','Sân']},{t:'10:35',x:'Lắp xong 4 mắt, cài app cho khách, khách đã nghiệm thu.',p:['Mắt 1','Đầu ghi','Biên bản']}]},
  {id:2, title:'Bảo hành khóa vân tay không nhận thẻ', loai:'Bảo hành', kh:'Chị Nguyễn Thu Lan', sdt:'0988 112 233', dc:'Tòa R2, Vinhomes Riverside, Long Biên', gio:'11:30', han:'Hôm nay 14:00', uu:'Cao', st:'dang', giao:'Giám đốc · 25/11',
    log:[{t:'11:50',x:'Kiểm tra: đầu đọc thẻ lỗi, đang thay module.',p:['Khóa cửa']}]},
  {id:3, title:'Lắp rèm cửa tự động phòng họp', loai:'Lắp đặt', kh:'Công ty TNHH Minh Phát', sdt:'024 3636 8899', dc:'Tầng 5, 18 Tam Trinh, Hoàng Mai', gio:'14:30', han:'Hôm nay 17:00', uu:'Trung bình', st:'moi', giao:'Giám đốc · 25/11', log:[]},
  {id:4, title:'Thay công tắc cảm ứng tầng 2', loai:'Lắp đặt', kh:'Anh Trịnh Quốc Việt', sdt:'0904 778 901', dc:'Biệt thự B5, KĐT Văn Phú, Hà Đông', gio:'16:00', han:'Hôm nay 17:30', uu:'Thấp', st:'cho', giao:'Giám đốc · 23/11',
    log:[{t:'09:10',x:'Gọi khách: khách đi công tác, hẹn về mở cửa lúc 16h.',p:[]}]},
  {id:5, title:'Bảo hành camera mất kết nối wifi', loai:'Bảo hành', kh:'Cô Đỗ Thị Hạnh', sdt:'0913 556 120', dc:'Ngõ 32 Ngọc Lâm, Long Biên', gio:'—', han:'Hôm qua 17:00', uu:'Cao', st:'qua', giao:'Giám đốc · 23/11',
    log:[{t:'24/11 16:20',x:'Đã reset router, vẫn rớt mạng. Cần mang bộ kích sóng.',p:['Router']}]},
];

const state = {screen:'viec', filter:'all', taskId:2, pending:[], reportSent:false, reportPhotos:[], period:'ngay', rid:1, err:''};

function toast(msg){
  const t = document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2600);
}
const icon = {
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>',

function chart(s){
  const W=640,H=220,L=40,B=26,T=12, max=Math.ceil(Math.max(...s.v)*1.15/10)*10;
  const n=s.v.length, slot=(W-L-8)/n, bw=Math.min(34,slot*.62);
  const y=v=>T+(H-T-B)*(1-v/max);
  let g='';
  for(let i=0;i<=4;i++){const v=max*i/4;g+=`<line x1="${L}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${vn(Math.round(v),0)}</text>`;}
  const bars=s.v.map((v,i)=>{const x=L+slot*i+(slot-bw)/2,last=i===n-1,prev=i===n-2;
    return `<rect x="${x}" y="${y(v)}" width="${bw}" height="${H-B-y(v)}" rx="4" fill="${last?'var(--brand)':'var(--brand-soft)'}" stroke="${prev?'var(--brand)':'none'}" stroke-dasharray="${prev?'3 3':''}"><title>${s.lab[i]}: ${vn(v)} triệu đ</title></rect>
      ${last?`<text x="${x+bw/2}" y="${y(v)-5}" text-anchor="middle" style="fill:var(--ink);font-weight:700">${vn(v)}</text>`:''}
      <text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${s.lab[i]}</text>`}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ doanh số">${g}${bars}</svg>`;
}

    <p class="small muted" style="margin:0">Kỹ thuật không thấy màn hình này. Kế toán chỉ thấy phần thu chi và công nợ.</p>
  </div>`;
}

/* ---------- Màn 5: Duyệt báo cáo ---------- */
const reports = [
  {id:1,n:'Trần Văn Hùng',r:'Kỹ thuật',st:'cho',t:'17:42',late:false,
    m:[['Ca lắp đặt',1],['Ca bảo hành',0],['Ca còn treo',4]],
    done:['Lắp camera 4 mắt + đầu ghi · Anh Hoàng Văn Bình'],
    ton:[['Bảo hành khóa vân tay · Chị Lan','Chờ module đọc thẻ mới, kho giao sáng mai'],['Lắp rèm tự động · Minh Phát','Khách dời lịch sang 9h sáng mai'],['Thay công tắc cảm ứng · Anh Việt','Khách đi công tác chưa về'],['Bảo hành camera · Cô Hạnh','Cần mang bộ kích sóng wifi']],
    plan:'Sáng: quay lại nhà cô Hạnh lắp bộ kích sóng wifi. Chiều: lắp rèm cho Minh Phát.', ph:['Nghiệm thu','Khóa cửa','Đầu ghi']},
  {id:2,n:'Vũ Thị Mai',r:'Kế toán',st:'cho',t:'17:55',late:false,
    m:[['Thu (triệu đ)',58],['Chi (triệu đ)',21.5],['Công nợ phải thu',186]],
    done:['Đối chiếu công nợ Khách sạn Sen Vàng','Thanh toán tiền hàng NCC camera đợt 2','Xuất 6 hóa đơn VAT'],
    ton:[['Thu nợ Công ty Minh Phát','Kế toán bên khách hẹn chuyển khoản thứ Sáu']],
    plan:'Gọi nhắc nợ Anh Việt; chuẩn bị bảng lương tháng 11.', ph:['Phiếu thu']},
  {id:3,n:'Lê Minh Tuấn',r:'Kỹ thuật',st:'cho',t:'18:20',late:true,returned:'24/11 · Giám đốc: “Thiếu ảnh nghiệm thu ca Khách sạn Sen Vàng, bổ sung giúp anh.”',
    m:[['Ca lắp đặt',2],['Ca bảo hành',1],['Ca còn treo',3]],
    done:['Lắp 12 khóa thẻ từ · Khách sạn Sen Vàng','Lắp chuông cửa có hình · Chị Hương','Bảo hành công tắc · Anh Toàn'],
    ton:[['Lắp hệ thống báo cháy · Nhà hàng Gió','Thiếu dây tín hiệu, đã báo kho'],['Khảo sát nhà Anh Dũng','Khách bận, hẹn lại'],['Bảo hành rèm · Anh Dũng','Chưa có linh kiện motor']],
    plan:'Hoàn thiện báo cháy Nhà hàng Gió; nhận motor rèm.', ph:['Sen Vàng 1','Sen Vàng 2','Chuông cửa','Công tắc']},
  {id:4,n:'Phạm Đức Long',r:'Kỹ thuật',st:'chuanop'},
  {id:5,n:'Trần Văn Hùng',r:'Kỹ thuật',st:'xong',t:'24/11 17:30',day:'24/11'},
];
const RST = {cho:'Chờ duyệt', xong:'Đã duyệt', tra:'Đã trả lại', chuanop:'Chưa nộp'};
function screenReview(){
  const r = reports.find(x=>x.id===state.rid);
  const pending = reports.filter(x=>x.st==='cho').length;
  return `<div class="laptop">
    <div class="lhead"><div><div class="muted small">Giám đốc · ${pending} báo cáo chờ duyệt</div><h1>Duyệt báo cáo ngày 25/11/2026</h1></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><select aria-label="Loại báo cáo" style="width:auto"><option>Báo cáo ngày</option><option>Tổng hợp tuần</option><option>Tổng hợp tháng</option></select><button class="btn sm" data-toast="Bản thật: tải file Excel các báo cáo">${icon.xls} Xuất Excel</button></div></div>
    <div class="review">
      <div class="rlist">${reports.map(x=>`
        <button class="ritem ${x.id===state.rid?'on':''}" data-rid="${x.id}" ${x.st==='chuanop'||x.day?'disabled':''}>
          <div class="row"><b style="font-weight:600">${x.n}</b><span class="pill s-${x.st}">${RST[x.st]}</span></div>
          <div class="small muted num">${x.r} · ${x.st==='chuanop'?'Chưa nộp · hạn 18:00':x.day?'Báo cáo ngày '+x.day:'Nộp lúc '+x.t}${x.late?' · <span style="color:var(--bad);font-weight:600">muộn</span>':''}${x.returned?' · nộp lần 2':''}</div>
        </button>`).join('')}
        <button class="btn sm" data-toast="Bản thật: gửi thông báo nhắc nộp báo cáo">Nhắc người chưa nộp</button>
      </div>
      ${r ? `<section class="panel">
        <div class="phd"><div><h2 style="font-size:18px">${r.n} <span class="muted" style="font-weight:400">· ${r.r}</span></h2><div class="small muted num">Nộp lúc ${r.t} · ${r.late?'<span style="color:var(--bad);font-weight:600">Nộp muộn (sau 18:00)</span>':'<span style="color:var(--ok);font-weight:600">Đúng hạn</span>'}</div></div><span class="pill s-${r.st}">${RST[r.st]}</span></div>
        ${r.returned?`<div class="history">↩ Đã trả lại 1 lần: ${esc(r.returned)}</div>`:''}
        <div class="mgrid num">${r.m.map(([k,v])=>`<div><span class="small muted">${k}</span><b>${vn(v)}</b></div>`).join('')}</div>
        <div><div class="sec-title">Việc đã xong (${r.done.length})</div><ul class="list">${r.done.map(d=>`<li>${esc(d)}</li>`).join('')}</ul></div>
        <div><div class="sec-title">Việc tồn và lý do (${r.ton.length})</div><div class="tblwrap"><table><tbody>${r.ton.map(([a,b])=>`<tr><td style="font-weight:500">${esc(a)}</td><td class="muted">${esc(b)}</td></tr>`).join('')}</tbody></table></div></div>
        <div><div class="sec-title">Kế hoạch ngày mai</div><p style="margin:4px 0 0">${esc(r.plan)}</p></div>
        <div><div class="sec-title">Ảnh (${r.ph.length})</div><div class="photos" style="margin-top:6px">${r.ph.map((p,i)=>fakePh(i+r.id,p)).join('')}</div></div>
        ${r.st==='cho'?`
        <label class="f">Ghi chú cho nhân viên <span class="small muted" style="font-weight:400">(bắt buộc khi trả lại)</span><textarea id="note" placeholder="Ví dụ: Bổ sung ảnh nghiệm thu, ghi rõ ngày hẹn lại khách…"></textarea></label>
        ${state.err?`<div class="err">${state.err}</div>`:''}
        <div class="actions"><button class="btn bad" data-act="return">↩ Trả lại</button><button class="btn ok" data-act="approve">✓ Duyệt</button></div>`
        : `<div class="small muted">${r.st==='xong'?'Đã duyệt. Số liệu đã lên dashboard.':'Đã trả lại. Nhân viên nhận thông báo và nộp lại.'}${r.note?' Ghi chú: “'+esc(r.note)+'”':''}</div>`}
      </section>` : ''}
    </div>
  </div>`;
}

/* ---------- Điều hướng ---------- */
function render(){
  $('#tabs').innerHTML = SCREENS.map((s,i)=>`<button role="tab" aria-selected="${s.id===state.screen}" data-go="${s.id}">${i+1}. ${s.name} <span class="dev">${s.dev}</span></button>`).join('');
  const f = {viec:screenList,'chi-tiet':screenDetail,'bao-cao':screenReport,dashboard:screenDash,duyet:screenReview}[state.screen];
  $('#app').innerHTML = f();
}
function go(id){ state.err=''; state.screen=id; if(location.hash!=='#'+id) history.replaceState(null,'','#'+id); render(); window.scrollTo(0,0); }
function fromHash(){ const h=location.hash.slice(1); if(SCREENS.some(s=>s.id===h)) state.screen=h; render(); }
window.addEventListener('hashchange', fromHash);

document.addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  const d = b.dataset;
  if (d.go) return go(d.go);
  if (d.toast) return toast(d.toast);
  if (d.filter){ state.filter=d.filter; return render(); }
  if (d.task){ state.taskId=+d.task; state.pending=[]; return go('chi-tiet'); }
  if (d.st){ const t=tasks.find(x=>x.id===state.taskId); t.st=d.st; if(d.st==='xong') reportDone.add(t.id); else reportDone.delete(t.id); t.log.push({t:'Bây giờ',x:'Đổi trạng thái sang “'+ST[d.st]+'”.',p:[]}); toast('Đã đổi trạng thái: '+ST[d.st]); return render(); }
  if (d.period){ state.period=d.period; return render(); }
  if (d.rid){ state.rid=+d.rid; state.err=''; return render(); }
  const a = d.act;
  if (a==='send-upd'){
    const txt=$('#upd').value.trim();
    if(!txt && !state.pending.length) return toast('Ghi nội dung hoặc chụp ít nhất 1 ảnh');
    const t=tasks.find(x=>x.id===state.taskId);
    const now=new Date(); t.log.push({t:now.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'}),x:txt||'Cập nhật ảnh hiện trường.',p:[...state.pending]});
    state.pending=[]; state.draft=''; toast('Đã gửi cập nhật'); return render();
  }
  if (a==='submit-report'){
    const miss = tasks.filter(t=>!reportDone.has(t.id) && !(t.ly||'').trim());
    if (miss.length){ state.err=`Còn ${miss.length} việc chưa xong chưa ghi lý do.`; return render(); }
    state.err=''; state.reportSent=true; toast('Đã nộp báo cáo'); return render();
  }
  if (a==='reopen'){ state.reportSent=false; return render(); }
  if (a==='approve' || a==='return'){
    const r=reports.find(x=>x.id===state.rid), note=$('#note').value.trim();
    if (a==='return' && !note){ state.err='Cần ghi chú lý do trả lại để nhân viên biết sửa gì.'; return render(); }
    r.st = a==='approve'?'xong':'tra'; r.note=note; state.err='';
    toast(a==='approve'?'Đã duyệt báo cáo của '+r.n:'Đã trả lại báo cáo cho '+r.n);
    const next=reports.find(x=>x.st==='cho'); if(next) state.rid=next.id;
    return render();
  }
});
document.addEventListener('change', e=>{
  const el=e.target;
  if (el.dataset.done){ const id=+el.dataset.done; el.checked?reportDone.add(id):reportDone.delete(id); state.err=''; render(); }
  if (el.id==='cam' || el.id==='rcam'){
    const list = el.id==='cam'?state.pending:state.reportPhotos;
    [...el.files].forEach(f=>{const fr=new FileReader(); fr.onload=()=>{list.push(fr.result); render();}; fr.readAsDataURL(f);});
  }
});
document.addEventListener('input', e=>{ if(e.target.id==='upd') state.draft=e.target.value; if(e.target.dataset.ly){ tasks.find(t=>t.id===+e.target.dataset.ly).ly=e.target.value; } });

fromHash();
</script>
