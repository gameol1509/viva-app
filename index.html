<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VIVA Smart Công việc</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Bố cục: thanh bên trái (menu phân hệ) + vùng làm việc; trên màn hẹp menu chuyển lên trên */
:root{
  --bg:#eef2f6; --surface:#ffffff; --sunk:#f5f7fa; --ink:#152033; --muted:#5a6578; --line:#dbe1ea;
  --brand:#0a66c2; --brand-ink:#ffffff; --brand-soft:#e2eefb; --side:#12233d; --side-ink:#c9d6ea; --side-on:#ffffff;
  --ok:#137a48; --ok-soft:#e0f3e8; --warn:#a86200; --warn-soft:#fcefd8;
  --bad:#c0362c; --bad-soft:#fbe5e3; --wait:#6a4bbd; --wait-soft:#eee9fb;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 12px 32px rgba(20,30,50,.14); --scrim:rgba(15,25,40,.35);
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e131b; --surface:#161d28; --sunk:#111821; --ink:#e6ebf2; --muted:#97a2b4; --line:#283244;
  --brand:#4d9cf0; --brand-ink:#08121f; --brand-soft:#132840; --side:#0a1220; --side-ink:#9fb0c8; --side-on:#ffffff;
  --ok:#4cc483; --ok-soft:#12291d; --warn:#f0b04c; --warn-soft:#2c2311;
  --bad:#f27b71; --bad-soft:#341816; --wait:#a88ff2; --wait-soft:#221b37;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.45); --scrim:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131b; --surface:#161d28; --sunk:#111821; --ink:#e6ebf2; --muted:#97a2b4; --line:#283244;
  --brand:#4d9cf0; --brand-ink:#08121f; --brand-soft:#132840; --side:#0a1220; --side-ink:#9fb0c8; --side-on:#ffffff;
  --ok:#4cc483; --ok-soft:#12291d; --warn:#f0b04c; --warn-soft:#2c2311;
  --bad:#f27b71; --bad-soft:#341816; --wait:#a88ff2; --wait-soft:#221b37;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.45); --scrim:rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:12px}

.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding-left:max(12px,env(safe-area-inset-left,0px))}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px 18px;color:var(--side-on)}
.logo i{width:32px;height:32px;border-radius:9px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-style:normal;font-weight:700}
.logo b{display:block;font-size:15px;line-height:1.2} .logo small{font-size:11px;color:var(--side-ink)}
.nav{border:0;background:none;color:inherit;text-align:left;padding:9px 12px;border-radius:9px;display:flex;align-items:center;gap:10px;font-weight:500;width:100%}
.nav svg{width:18px;height:18px;flex:0 0 auto}
.nav:hover{background:rgba(255,255,255,.06)}
.nav.on{background:rgba(255,255,255,.12);color:var(--side-on)}
.nav .cnt{margin-left:auto;background:var(--bad);color:#fff;font-size:11px;border-radius:99px;padding:0 7px;font-weight:600}
.side .foot{margin-top:auto;font-size:11px;padding:8px;line-height:1.4}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px 24px}
.topbar h1{font-size:20px;margin-right:auto}
.who{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.who select{width:auto;font-weight:600;color:var(--ink);padding:7px 10px}
.bell{position:relative;border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:10px;display:grid;place-items:center}
.bell b{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;font-size:10px;border-radius:99px;padding:1px 6px}
.content{padding:20px max(16px,env(safe-area-inset-right,0px)) 40px 24px;display:flex;flex-direction:column;gap:16px;max-width:1320px;width:100%}
.demo{background:var(--warn-soft);color:var(--warn);font-size:12px;font-weight:500;padding:8px 12px;border-radius:10px}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:8px max(16px,env(safe-area-inset-left,0px));gap:4px}
  .logo{padding:0 8px 0 0} .logo div{display:none} .side .foot{display:none}
  .nav{width:auto;white-space:nowrap}
  .topbar,.content{padding-left:max(16px,env(safe-area-inset-left,0px))}
}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font-size:15px;font-weight:600}
.phd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.grid2.eq{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:1000px){.grid2,.grid2.eq{grid-template-columns:minmax(0,1fr)}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:500}
.kpi .val{font-size:24px;font-weight:700;letter-spacing:-.01em}
.delta{font-weight:600} .up{color:var(--ok)} .down{color:var(--bad)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.plain::before{display:none}
.s-moi,.s-chuanop{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.s-dang{background:var(--brand-soft);color:var(--brand)}
.s-cho{background:var(--wait-soft);color:var(--wait)}
.s-xong{background:var(--ok-soft);color:var(--ok)}
.s-qua,.s-tra{background:var(--bad-soft);color:var(--bad)}
.s-warn{background:var(--warn-soft);color:var(--warn)}
.p-cao{color:var(--bad);font-weight:600} .p-tb{color:var(--warn);font-weight:600} .p-thap{color:var(--muted)}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.ok{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.link{border:0;background:none;padding:0;color:var(--brand);font-weight:600;text-align:left}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px}
.chips button.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chips button .c{opacity:.7;margin-left:4px}
input[type=text],input[type=number],input[type=date],input[type=datetime-local],textarea,select{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px;width:100%;font-weight:400}
textarea{resize:vertical;min-height:70px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
@media (max-width:600px){.form{grid-template-columns:minmax(0,1fr)}}
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.err{color:var(--bad);font-size:13px;font-weight:600}
.files{display:flex;gap:6px;flex-wrap:wrap}
.file{display:inline-flex;align-items:center;gap:5px;font-size:12px;background:var(--sunk);border:1px solid var(--line);border-radius:7px;padding:3px 8px}
.filebtn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--brand);cursor:pointer}
.filebtn input{display:none}

.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--sunk)}
td.r,th.r{text-align:right}
tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;min-width:70px;flex:1}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.bar i.w{background:var(--warn)} .bar i.b{background:var(--bad)}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
.fin{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fin div{background:var(--sunk);border-radius:10px;padding:10px;display:flex;flex-direction:column}
.fin b{font-size:17px}
.alert{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:12px;font-size:13px}
.alert.bad{background:var(--bad-soft);color:var(--bad)} .alert.warn{background:var(--warn-soft);color:var(--warn)} .alert.ok{background:var(--ok-soft);color:var(--ok)} .alert.info{background:var(--brand-soft);color:var(--brand)}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* Ngăn kéo chi tiết + hộp thoại */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(600px,100%);background:var(--surface);z-index:41;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px)}
.dhead{display:flex;gap:12px;align-items:flex-start;padding:18px 20px;border-bottom:1px solid var(--line)}
.dhead h2{font-size:18px;flex:1}
.dbody{flex:1;overflow-y:auto;padding:18px 20px 30px;display:flex;flex-direction:column;gap:16px}
.x{border:1px solid var(--line);background:var(--surface);width:34px;height:34px;border-radius:9px;flex:0 0 auto;font-size:18px;line-height:1}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,calc(100% - 32px));max-height:calc(100% - 40px);overflow-y:auto;background:var(--surface);z-index:41;border-radius:16px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:14px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;margin:0;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500}
.seg{display:flex;gap:4px;background:var(--sunk);border:1px solid var(--line);padding:4px;border-radius:11px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tl{display:flex;flex-direction:column}
.tl .it{display:grid;grid-template-columns:14px 1fr;gap:10px;padding-bottom:14px;position:relative}
.tl .it::before{content:"";position:absolute;left:6px;top:16px;bottom:0;width:2px;background:var(--line)}
.tl .it:last-child::before{display:none}
.dot{width:14px;height:14px;border-radius:50%;border:3px solid var(--brand);background:var(--surface);margin-top:3px}
.pop{position:absolute;right:0;top:46px;width:min(380px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:8px;z-index:30;max-height:70vh;overflow-y:auto}
.pop button{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:9px}
.pop button:hover{background:var(--sunk)}
.review{display:grid;grid-template-columns:330px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1000px){.review{grid-template-columns:minmax(0,1fr)}}
.rlist{display:flex;flex-direction:column;gap:6px}
.ritem{display:flex;flex-direction:column;gap:3px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;width:100%}
.ritem.on{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.ritem .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.mgrid div{background:var(--sunk);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column}
.mgrid b{font-size:20px}
.list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;z-index:60;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.chk{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.chk:first-child{border-top:0}
.chk input[type=checkbox]{width:18px;height:18px;margin-top:2px;accent-color:var(--ok)}
.ton{display:grid;grid-template-columns:180px minmax(0,1fr);gap:8px;margin-top:6px}
@media (max-width:600px){.ton{grid-template-columns:minmax(0,1fr)}}
</style>
</head><body>

  <aside class="side" id="side"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content" id="content"></main>
  </div>
</div>

function chart(s){
  const W=640,H=220,L=40,B=26,T=14,max=Math.ceil(Math.max(...s.v)*1.15/10)*10,n=s.v.length,slot=(W-L-8)/n,bw=Math.min(34,slot*.62),y=v=>T+(H-T-B)*(1-v/max);
  let g='';for(let i=0;i<=4;i++){const v=max*i/4;g+=`<line x1="${L}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${vn(Math.round(v),0)}</text>`;}
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ doanh số">${g}${s.v.map((v,i)=>{const x=L+slot*i+(slot-bw)/2,last=i===n-1,prev=i===n-2;
    return `<rect x="${x}" y="${y(v)}" width="${bw}" height="${H-B-y(v)}" rx="4" fill="${last?'var(--brand)':'var(--brand-soft)'}" stroke="${prev?'var(--brand)':'none'}" stroke-dasharray="3 3"><title>${s.lab[i]}: ${vn(v)} triệu đ</title></rect>${last?`<text x="${x+bw/2}" y="${y(v)-5}" text-anchor="middle" style="fill:var(--ink);font-weight:700">${vn(v)}</text>`:''}<text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${s.lab[i]}</text>`}).join('')}</svg>`;
}

function seeded(seed){let x=seed;return()=>{x=(x*16807)%2147483647;return x/2147483647;}}
function aggData(uid){
  const days=state.agg==='tuan'?6:21, rnd=seeded([...uid].reduce((a,c)=>a+c.charCodeAt(0),0)*(days+3)), d=DEPTS[USERS[uid].dept];
  const base={sales:[5,2.5,1,40],kt:[1.6,1.2,2],ketoan:[42,24,186],qlkh:[8,1,1]}[USERS[uid].dept];
  const ot=state.agg==='tuan'?[Math.max(3,6-Math.floor(rnd()*3)),6]:ONTIME[uid];
  const sub=Math.min(days,ot[0]+Math.floor(rnd()*2));
  const m=d.m.map(([,sum],i)=>sum?Math.round(base[i]*sub*(.75+rnd()*.5)*10)/10:base[i]);
  return {sub,ot:ot[0],days,m};
}
function repAgg(){
  const depts=Object.keys(DEPTS).filter(k=>isGD()||k===me().dept);

  if(o.t==='newtask'){inner=modalTask();cls='modal';}
  if(o.t==='newcus'){inner=modalCus();cls='modal';}

    if(r.st==='tra') r.prev=r.note;
    Object.assign(r,{st:'cho',t:NOW,late:NOW>DEADLINE,m:F.m.map(Number),plan:F.plan,f:[...F.f],note:'',
      done:mine.filter(t=>F.done.has(t.id)).map(t=>t.title),ton:mine.filter(t=>!F.done.has(t.id)).map(t=>[t.title,F.ton[t.id].reason,F.ton[t.id].note])});
    mine.forEach(t=>{if(F.done.has(t.id)&&t.st!=='xong'){t.st='xong';t.log.push({t:NOW,who:state.me,x:'Đánh dấu hoàn thành qua báo cáo ngày'});}});
    state.editing=false;state.form=null;state.err='';toast('Đã nộp báo cáo, chờ '+uname(reviewer(state.me))+' duyệt');return render();
  }
  if(a==='approve'||a==='return'){
    const note=$('#rnote').value.trim(), r=REP[state.rid];
    if(a==='return'&&!note){state.err='Cần ghi chú lý do trả lại để nhân viên biết sửa gì.';return render();}
    Object.assign(r,{st:a==='approve'?'xong':'tra',note,by:state.me,rt:NOW});state.err='';
    toast(a==='approve'?'Đã duyệt báo cáo của '+uname(state.rid):'Đã trả lại báo cáo cho '+uname(state.rid));
    state.rid=Object.keys(REP).find(u=>canReview(u)&&REP[u].st==='cho'&&(!state.rdept||USERS[u].dept===state.rdept))||state.rid; return render();
  }
  if(a==='nudge') return toast('Đã gửi nhắc nộp báo cáo (bản thật sẽ báo qua thông báo điện thoại)');
  if(a==='xls-tasks') return exportXls('cong-viec',['Mã','Công việc','Khách hàng','Người nhận','Phòng','Hạn','Ưu tiên','Trạng thái'],visibleTasks().map(t=>['CV-'+p2(t.id),t.title,cname(t.cus),uname(t.to),DEPTS[t.dept].n,fdt(t.due),PRIO[t.prio],ST[est(t)]]));
  if(a==='xls-cus') return exportXls('khach-hang',['Khách','SĐT','Địa chỉ','Nguồn','Hết hạn BH'],CUS.filter(seeCus).map(c=>[c.n,c.sdt,c.dc,c.src,c.bh?fdy(c.bh):'']));
  if(a==='xls-agg'){const rows=[];Object.keys(DEPTS).filter(k=>isGD()||k===me().dept).forEach(k=>Object.values(USERS).filter(u=>u.dept===k).forEach(u=>{const g=aggData(u.id);rows.push([DEPTS[k].n,u.n,g.sub+'/'+g.days,Math.round(g.ot/g.days*100)+'%',...DEPTS[k].m.map(([n],i)=>n+': '+g.m[i])]);}));return exportXls('tong-hop-'+state.agg,['Phòng','Nhân viên','Đã nộp','Đúng hạn','Chỉ số 1','Chỉ số 2','Chỉ số 3','Chỉ số 4'],rows);}
});
document.addEventListener('change',e=>{
  const el=e.target,d=el.dataset;
  if(el.id==='who'){state.me=el.value;state.editing=false;state.form=null;state.rid=null;state.rtab=null;state.rdept='';state.overlay=null;state.tf={dept:'',user:'',st:'',q:''};state.cf.flag='';toast('Đang xem với vai trò: '+me().title);return render();}
  if(el.id==='tf-dept'){state.tf.dept=el.value;return render();}
  if(el.id==='tf-user'){state.tf.user=el.value;return render();}
  if(el.id==='cf-src'){state.cf.src=el.value;return render();}
  if(d.rdone){const id=+d.rdone;el.checked?state.form.done.add(id):state.form.done.delete(id);if(!state.form.ton[id])state.form.ton[id]={reason:'',note:''};state.err='';return render();}
  if(d.rton&&d.k==='reason'){state.form.ton[d.rton].reason=el.value;return;}
  if(d.kn){const [c,i]=d.kn.split(':');const k=CUS.find(x=>x.id===+c).kn[+i];k.st=el.value;if(el.value!=='moi'&&!k.who)k.who=state.me;toast('Đã cập nhật khiếu nại');return render();}
  if(d.care){const [c,i]=d.care.split(':');CUS.find(x=>x.id===+c).care[+i][3]=el.checked;return toast(el.checked?'Đã đánh dấu đã gọi':'Bỏ đánh dấu');}
  if(el.id==='upfile'){state.upFiles.push(...[...el.files].map(f=>f.name));state.draft=$('#upd').value;return renderLayer();}
  if(el.id==='rfile'){state.form.f.push(...[...el.files].map(f=>f.name));return render();}
});
let qTimer;
document.addEventListener('input',e=>{
  const el=e.target,d=el.dataset;
  if(el.id==='upd') state.draft=el.value;
  if(el.id==='rplan') state.form.plan=el.value;
  if(d.rm!==undefined) state.form.m[+d.rm]=el.value;
  if(d.rton&&d.k==='note') state.form.ton[d.rton].note=el.value;
  if(el.id==='tf-q'||el.id==='cf-q'){clearTimeout(qTimer);qTimer=setTimeout(()=>{(el.id==='tf-q'?state.tf:state.cf).q=el.value;render();const n=$('#'+el.id);n.focus();n.setSelectionRange(n.value.length,n.value.length);},250);}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(state.overlay||state.bell)){state.overlay=null;state.bell=false;render();}});

(()=>{const h=location.hash.slice(1);if(PAGES.some(p=>p.id===h))state.page=h;render();})();
</script>
</body></html>
